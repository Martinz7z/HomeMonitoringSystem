<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesmain.css') }}">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
    <title>Document</title>
</head>
<body>
    <header class="temp_header">
        <a href="{{ url_for('index')}}" class="temp_logo">Home System</a>
        <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
        <button class="hamburger_menu" onclick="toggleMenu()"><svg xmlns="http://www.w3.org/2000/svg" width="35"
                height="35" viewBox="0 0 24 24">
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 17h14M5 12h14M5 7h14" />
            </svg></button>

        <nav class="temp_nav">
            <a href="{{ url_for('index')}}" class="nav_item">Home</a>
            <a href="{{ url_for('temp')}}" class="nav_item">Temperature</a>
            <a href="{{ url_for('humidity')}}" class="nav_item">Humidity</a>
            <a href="{{ url_for('soilTemp')}}" class="nav_item">Motion Sensor</a>
            <a href="/protected_area" class="nav_item">Device</a> 
            {% if logged_in %}
            <a href="{{ url_for('logout') }}" class="temp_signup">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}" class="temp_signup">Login</a>
            {% endif %}
        </nav>
 
    </header>


    <section class="main_page">
        <div class="main_page_container">
            <div class="main_page_contents">
                <div class="tempature">
                    <h1>TEMPERATURE</h1>
                    <h3>9°C</h3>
                    <img src="{{ url_for('static', filename='images/hot.png') }}" alt="">
                </div>
    
                <div class="humidity">
                    <h1>HUMIDITY</h1>
                    <h3>8°C</h3>
                    <img src="{{ url_for('static', filename='images/cold.png') }}" alt="">
               </div>
    
               <div class="soil_temp">
                    <h1>SOIL MOISTURE</h1>
                    <h3>WET</h3>
                    <img src="{{ url_for('static', filename='images/ok.png') }}" alt="">
               </div>
            </div>
        </div>
    </section>
</body>
</html>
